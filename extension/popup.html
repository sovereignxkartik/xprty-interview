<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>XPRTY Guardian</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      width: 290px;
      padding: 16px;
      margin: 0;
      background: #110F0E;
      color: #F4F2EB;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(219, 122, 87, 0.15);
      color: #DB7A57;
      border: 1px solid rgba(219, 122, 87, 0.3);
      margin-bottom: 12px;
    }
    h3 {
      margin: 0 0 6px 0;
      font-family: 'Fraunces', serif;
      font-size: 17px;
      color: #F4F2EB;
    }
    p {
      margin: 0 0 16px 0;
      font-size: 12px;
      color: #ABA7A2;
      line-height: 1.5;
    }
    .card {
      background: #191715;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      border: 1px solid #32302D;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      color: #CBC3B9;
    }
    .val {
      font-family: ui-monospace, monospace;
      color: #DB7A57;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <span class="badge">&lt;/&gt; PROCTORING ACTIVE</span>
  <h3>XPRTY Guardian</h3>
  <p>Monitors candidate browser focus, tab switches, and enforces interviewer website permissions.</p>
  <div class="card">
    <div class="row"><span>Status:</span> <span class="val">Connected</span></div>
    <div class="row"><span>Platform:</span> <span class="val">XPRTY Standalone</span></div>
    <div class="row"><span>Security:</span> <span class="val">Manifest V3</span></div>
  </div>
</body>
</html>
